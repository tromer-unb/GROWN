[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grown-crystal-growth"
version = "0.1.0"
description = "A reproducible, orientation-aware framework for template-guided atomistic crystal growth"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["ase>=3.22", "numpy>=1.24", "scipy>=1.10"]
classifiers = [
 "Development Status :: 3 - Alpha",
 "Intended Audience :: Science/Research",
 "License :: OSI Approved :: MIT License",
 "Programming Language :: Python :: 3",
 "Programming Language :: Python :: 3.10",
 "Programming Language :: Python :: 3.11",
 "Topic :: Scientific/Engineering :: Physics"
]

[project.scripts]
grown-input = "grown_input:main"

[project.urls]
Homepage = "https://github.com/tromer-unb/GROWN"
Repository = "https://github.com/tromer-unb/GROWN"
Issues = "https://github.com/tromer-unb/GROWN/issues"

[tool.setuptools]
py-modules = ["grown_input", "mc_flux_corrigido_multiaxis_v4", "growth_parameter_advisor_corrected_multiaxis_v4"]

[tool.setuptools.package-dir]
"" = "software/GROWN_INPUT_BUILDER"
