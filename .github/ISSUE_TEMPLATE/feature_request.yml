name: Feature proposal
description: Propose an input-builder improvement or a new scientific capability
title: "[Feature]: "
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and example structure
    validations:
      required: true
  - type: textarea
    id: scientific
    attributes:
      label: Impact on scientific behavior and tests
      description: Explain geometry, PBC, new species, checkpoint and regression needs.
